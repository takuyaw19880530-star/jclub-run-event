const H=3600000, M=60000;
const TYPES={trophy:'トロフィーランブル',emblem:'エンブレムゲッター',supporter:'集まれ！サポーター！',panel:'パネルストライカー',town:'つくろう！スタジアムタウン',media:'マスメディア',other:'その他'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const finite=v=>typeof v==='number'&&Number.isFinite(v);
function number(v){if(v==null||String(v).trim()==='')return null;const s=String(v).trim().replace(/[,，\s]/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));const m=s.match(/^(\d+(?:\.\d+)?)(万|億)?$/);const n=m?Number(m[1])*(m[2]==='万'?1e4:m[2]==='億'?1e8:1):null;return finite(n)&&n<=Number.MAX_SAFE_INTEGER?n:null;}
function median(a){if(!a.length)return null;a=[...a].sort((a,b)=>a-b);return a[Math.floor(a.length/2)];}
function intervals(w,now,end){const a=w.filter(x=>finite(x.start)&&finite(x.end)).map(x=>[Math.max(now,x.start),Math.min(end,x.end)]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]),out=[];for(const x of a){const p=out.at(-1);if(p&&x[0]<=p[1])p[1]=Math.max(p[1],x[1]);else out.push([...x]);}return out;}
function available(e,now){return intervals(e.windows||[],now,e.end).reduce((s,x)=>s+(x[1]-x[0])/M,0);}
function latest(e,rank,now){return (e.records||[]).filter(r=>r.ts<=now&&r.ts>=e.start&&r.ts<=e.end&&finite(rank==null?r.myPoints:r.borders?.[rank])).sort((a,b)=>a.ts-b.ts);}
function speed(e){const s=(e.sessions||[]).filter(s=>s.phase===e.phase&&s.minutes>0&&s.gain>=0).sort((a,b)=>a.ts-b.ts).slice(-5);return {rate:median(s.map(s=>s.gain/s.minutes)),count:s.length,samples:s};}
function projection(e,rank,now){const a=latest(e,rank,now);if(!a.length)return null;const last=a.at(-1);const rates=[];for(let i=1;i<a.length;i++){const d=a[i].ts-a[i-1].ts,pt=a[i].borders[rank]-a[i-1].borders[rank];if(d>=5*M&&pt>=0)rates.push(pt/(d/H));}if(!rates.length)return {last:last.borders[rank],ts:last.ts,base:null,high:null,rate:null};const recent=rates.slice(-3),rate=median(recent),h=Math.max(0,(e.end-last.ts)/H);return {last:last.borders[rank],ts:last.ts,base:last.borders[rank]+rate*h,high:last.borders[rank]+Math.max(...recent,rate*(e.accel||1.5))*h,rate};}
function forecast(e,rank,now){let f=projection(e,rank,now);if(!f)return null;for(const r of e.ranks||[]){if(r>rank){const lo=projection(e,r,now);if(lo&&f.base!=null&&lo.base!=null){f.base=Math.max(f.base,lo.base);f.high=Math.max(f.high,lo.high);}}}return f;}
function assess(e,now,rank=e.target){const my=latest(e,null,now).at(-1),s=speed(e),f=e.mode==='rank'?forecast(e,rank,now):null;const target=e.mode==='goal'?(e.goal>0?e.goal:null):(f?(e.scenario==='base'?f.base:f.high):null);const line=finite(target)?target*(e.mode==='rank'?1+(e.margin||0)/100:1):null;const need=line==null||!my?null:Math.max(0,line-my.myPoints);const mins=need===0?0:need!=null&&s.rate>0?need/s.rate:null;const avail=available(e,now);const stale=e.mode==='rank'&&(!f||now-f.ts>(e.end-now<=24*H?2:6)*H);return {my,f,s,line,need,mins,avail,stale,spare:mins==null?null:avail-mins};}
function allocate(e,now,minutes){let left=minutes;return intervals(e.windows||[],now,e.end).map(x=>{const capacity=(x[1]-x[0])/M,run=left==null?null:Math.min(capacity,Math.max(0,left));if(left!=null)left-=run;return {start:x[0],end:x[1],capacity,run};});}
function mediaDay(e,now){const anchor=Math.floor((e.start+9*H)/86400000)*86400000-9*H+14*H;const day=Math.floor((now-anchor)/86400000)+1;return {day,anchor,close:anchor+day*86400000-30*M,open:anchor+day*86400000,collect:now>=anchor+day*86400000-30*M};}
function coinState(e){let balance=e.coinStart||0;for(const t of e.ledger||[])balance+=t.amount;const pending=(e.bonuses||[]).filter(x=>!x.received).reduce((s,x)=>s+x.amount,0);const rest=Math.max(0,(e.goal||0)-balance);const conditional=Math.max(0,rest-pending);const samples=(e.sessions||[]).filter(s=>s.phase===e.phase&&s.minutes>0&&s.gain>=0).slice(-5);const rate=median(samples.map(s=>s.gain/s.minutes));return {balance,pending,rest,conditional,rate,mins:conditional===0?0:rate>0?conditional/rate:null};}
function freshEvent(name,type,start,end,mode='rank'){return {id:uid(),name,type,start,end,mode:type==='media'?'media':mode,target:300,ranks:[100,300,500],goal:0,margin:5,accel:1.5,scenario:'high',phase:'通常',records:[],sessions:[],windows:[],ledger:[],bonuses:[],daily:[],coinStart:0,status:'active',why:'',finalRank:null};}
function validateEvent(e){if(!e||typeof e.id!=='string'||typeof e.name!=='string'||!finite(e.start)||!finite(e.end)||e.end<=e.start||!['rank','goal','media'].includes(e.mode))throw Error('イベントの形式が正しくありません');for(const k of ['records','sessions','windows','ledger','bonuses','daily'])if(!Array.isArray(e[k]))throw Error(k+' の形式が正しくありません');if(!Array.isArray(e.ranks)||e.ranks.some(r=>!Number.isInteger(r)||r<=0)||!Number.isInteger(e.target)||e.target<=0)throw Error('順位の形式が正しくありません');for(const r of e.records)if(!finite(r.ts)||(r.myPoints!=null&&(!finite(r.myPoints)||r.myPoints<0))||!r.borders||Object.values(r.borders).some(v=>!finite(v)||v<0))throw Error('記録の形式が正しくありません');for(const s of e.sessions)if(!finite(s.ts)||!finite(s.minutes)||s.minutes<=0||!finite(s.gain)||s.gain<0||typeof s.phase!=='string')throw Error('走行記録の形式が正しくありません');for(const w of e.windows)if(!finite(w.start)||!finite(w.end)||w.end<=w.start)throw Error('予定の形式が正しくありません');for(const t of e.ledger)if(!finite(t.amount))throw Error('コインの形式が正しくありません');for(const b of e.bonuses)if(!finite(b.amount)||b.amount<0)throw Error('報酬の形式が正しくありません');if(!finite(e.goal)||e.goal<0||!finite(e.margin)||e.margin<0||e.margin>50||!finite(e.accel)||e.accel<1||e.accel>5)throw Error('目標設定の形式が正しくありません');if(!finite(e.coinStart)||!['active','done'].includes(e.status)||typeof e.phase!=='string')throw Error('イベント設定の形式が正しくありません');for(const r of e.daily){if(!Number.isInteger(r.day)||r.day<1||r.day>14||!finite(r.ts)||!Array.isArray(r.slots)||r.slots.length>3)throw Error('日次記録の形式が正しくありません');for(const s of r.slots)if(typeof s.name!=='string'||[s.rank,s.score,s.target].some(v=>v!=null&&(!finite(v)||v<0)))throw Error('枠の形式が正しくありません');}return e;}
function importData(raw){if(!raw||!Array.isArray(raw.events))throw Error('イベントを含むJSONを選んでください');if(raw.schema===4){const events=raw.events.map(validateEvent);return {events,legacy:raw.legacy||null};}if(raw.version!==1)throw Error('対応形式は旧手帳 version 1 または NEXT schema 4 です');const events=[];for(const old of raw.events){if(!Array.isArray(old.boards))throw Error('旧データにボードがありません');for(const b of old.boards){const mode=old.type==='media'?'media':b.kind==='goal'?'goal':'rank';const e=freshEvent(old.name+(old.boards.length>1?' / '+b.name:''),old.type,old.start,old.end,mode);e.target=b.targetRank||old.targetRank||300;e.ranks=[...new Set([...(b.borderRanks||[]),e.target])].filter(x=>Number.isInteger(x)&&x>0);e.goal=Number(b.goalPoints)||0;e.margin=Number(old.safetyMargin)||0;e.why=old.memo||'';e.status=old.status==='done'?'done':'active';e.legacyBoard={eventId:old.id,boardId:b.id,kind:b.kind};e.records=(b.records||[]).map(r=>({...r,id:r.id||uid(),myPoints:finite(r.myPoints)?r.myPoints:null,borders:r.borders||{}}));if(mode==='media'){e.coinStart=b.kind==='goal'?(e.records.filter(r=>finite(r.myPoints)).sort((a,b)=>a.ts-b.ts).at(-1)?.myPoints||0):0;e.daily=b.kind==='daily'?(b.records||[]).map(r=>({id:r.id||uid(),day:r.day||mediaDay(e,r.ts).day,ts:r.ts,slots:r.slotData||[],legacy:true})):[];}events.push(validateEvent(e));}}return {events,legacy:raw};}

function demoData(){const n=Date.now(),e=freshEvent('最後の一日を、余裕で。','trophy',n-6*24*H,n+20*H);e.why='300位を守って、今夜は予定どおり終わる。';e.phase='銀トロ中心・5叩き';e.records=[[-24,92000000,178000000,88000000,61000000],[-12,107000000,190000000,99000000,67500000],[-6,115000000,198000000,105000000,71000000],[-2,121000000,204000000,110000000,74000000],[-.3,126000000,207000000,112000000,75100000]].map(x=>({id:uid(),ts:n+x[0]*H,myPoints:x[1],myRank:274,borders:{100:x[2],300:x[3],500:x[4]}}));e.sessions=[{id:uid(),ts:n-12*H,phase:e.phase,minutes:45,gain:7200000},{id:uid(),ts:n-6*H,phase:e.phase,minutes:30,gain:4500000},{id:uid(),ts:n-.3*H,phase:e.phase,minutes:30,gain:5000000}];e.windows=[{id:uid(),start:n+.5*H,end:n+2*H},{id:uid(),start:n+10*H,end:n+11*H},{id:uid(),start:n+17*H,end:n+18.5*H}];const m=freshEvent('3枠と、コインの行き先。','media',n-3*24*H,n+4*24*H);m.goal=450000;m.coinStart=182000;m.phase='試合＋宝箱';m.bonuses=[{id:uid(),label:'次回の順位報酬（自分の見込み）',amount:31000,received:false},{id:uid(),label:'以後3日分（自分の見込み）',amount:93000,received:false}];m.sessions=[{id:uid(),ts:n-H,phase:m.phase,minutes:30,gain:1200}];const day=mediaDay(m,n).day;m.daily=[{id:uid(),day,ts:n,slots:[{name:'メインホール',sub:'パス回数',mode:'TOTAL',rank:28,score:3840,target:50},{name:'SOCCER ZONE',sub:'フォーチュングッズ',mode:'1MATCH',rank:46,score:98000,target:50},{name:'JクラSPORTS',sub:'お気に入りクラブ',mode:'TOTAL',rank:63,score:72400,target:50}]}];return {schema:4,events:[e,m],selected:e.id,theme:'auto',live:null,legacy:null};}
function persist(){if(storageBlocked)throw Error('保存できない状態です。先にデータ画面でバックアップしてください。');localStorage.setItem(LS_KEY,JSON.stringify(state));}
function change(fn){const old=JSON.stringify(state);try{fn();persist();return true;}catch(err){state=JSON.parse(old);close();render();notify('保存できませんでした：'+err.message);return false;}}
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>$('toast').hidden=true,4500);}
function current(){return state.events.find(e=>e.id===state.selected);}
function theme(){const dark=state.theme==='dark'||state.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches;document.body.classList.toggle('dark',dark);document.querySelector('meta[name="theme-color"]').content=dark?'#101b1c':'#f3f2ed';}
function btn(text,act,cls='secondary',extra=''){return `<button class="${cls}" data-action="${act}" ${extra}>${text}</button>`;}
function field(label,id,value='',type='text',extra=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function numeric(label,id,value='',required=false){return field(label,id,value,'text',`inputmode="decimal" autocomplete="off" ${required?'required':''}`);}
function modal(title,body,onSave,label='保存する'){const root=$('modal');root.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button type="button" class="close" data-action="close" aria-label="閉じる">×</button></div><form id="form"><div id="formError" class="error" role="alert"></div><div class="formgrid">${body}</div>${onSave?`<button class="primary wide" style="margin-top:22px" type="submit">${label}</button>`:''}</form></section></div>`;document.body.style.overflow='hidden';$('form').onsubmit=ev=>{ev.preventDefault();try{onSave();}catch(err){$('formError').textContent=err.message;$('formError').style.display='block';}};setTimeout(()=>root.querySelector('input,select,textarea,button')?.focus(),10);}
function close(){ $('modal').innerHTML='';document.body.style.overflow='';}
function val(id){return $(id).value.trim();}
function num(id,required=false){const v=number(val(id));if(v==null&&(required||val(id)!==''))throw Error('数字を確認してください。12345、1.2万、0.8億の形で入力できます。');return v;}
function positive(id){const v=num(id,true);if(v<=0)throw Error('0より大きい値を入力してください');return v;}
function submit(fn,message='保存しました'){if(change(fn)){close();render();notify(message);}}
function render(){theme();const e=current();$('sampleFlag').hidden=!DEMO;$('selector').innerHTML='<option value="">イベント一覧</option>'+state.events.map(x=>`<option value="${esc(x.id)}" ${x.id===state.selected?'selected':''}>${esc(x.name)}</option>`).join('');$('live').innerHTML=state.live?`<div class="live"><span>● ${state.live.paused?'一時停止中':'走行を計測中'} · <b id="clock"></b></span>${btn('計測へ戻る','live','link')}</div>`:'';if(!e){$('app').innerHTML=home();$('nav').hidden=true;}else{$('nav').hidden=false;$('nav').innerHTML=[['now','◉','いま'],['run','◷','走る'],['plan','▤','作戦'],['history','≋','記録']].map(x=>`<button data-action="nav" data-value="${x[0]}" class="${view===x[0]?'active':''}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');const head=`<div class="pagehead"><div><div class="eyebrow">${esc(TYPES[e.type]||e.type)} · ${e.mode==='media'?'DAILY & COINS':e.mode==='goal'?'GOAL':'RACE PLAN'}</div><h1>${esc(e.name)}</h1><small>${dt(e.end)} 終了 · 日本時間</small></div>${btn('設定','editEvent','link')}</div>`;$('app').innerHTML=head+(e.status==='done'?review(e):view==='now'?(e.mode==='media'?mediaView(e):nowView(e)):view==='run'?runView(e):view==='plan'?planView(e):historyView(e));}tick();}
function home(){return `<div class="pagehead"><div><div class="eyebrow">RANIBE / NEXT</div><h1>走る時間を、決めよう。</h1><p class="muted">狙う順位と、使える時間。ここから作戦を。</p></div></div>${state.events.map(e=>`<button class="event card" data-action="select" data-value="${esc(e.id)}"><span class="eyebrow">${esc(TYPES[e.type]||e.type)} / ${e.status==='done'?'FINISHED':'ACTIVE'}</span><h2>${esc(e.name)}</h2><div class="row"><small>${e.mode==='media'?'コイン残高 '+fmt(coinState(e).balance):e.mode==='goal'?'目標 '+fmt(e.goal):'目標 '+e.target+'位'}</small><span>開く →</span></div></button>`).join('')||'<div class="card empty">最初のイベントを作るか、<br>旧手帳のJSONを取り込んでください。</div>'}<div class="cols">${btn('＋ イベントを作る','new','primary')}${btn('データを取り込む','data')}</div><p class="endnote">端末内に保存 · 外部通信・追加ライブラリなし<br>Jクラ非公式の個人用ツール</p>`;}
function nowView(e){const n=Date.now(),c=assess(e,n),ended=n>=e.end;let title,big,unit='分',explain,action;if(ended){title='終了。結果を残そう。';big='FINISH';unit='';explain='予測ではなく、ゲーム内の最終順位を記録します。';action=btn('最終結果を記録','finishEvent','primary');}else if(!c.my){title='いまの数字から、始めよう。';big='01';unit='';explain='自分のポイントと、狙う順位のボーダーを入力。';action=btn('最初の記録をつける','observe','primary');}else if(c.line==null){title=e.mode==='rank'?'ボーダーをもう一度。':'目標ポイントを決めよう。';big='—';unit='';explain=e.mode==='rank'?'時刻を変えた2回以上のボーダー記録で、終着点を試算します。':'作戦画面で、欲しい報酬に必要なポイントを決めます。';action=btn('数字を記録','observe','primary');}else if(c.stale){title='先に、ボーダーを確認。';big=compact(c.need);unit='Pt不足';explain='下の試算は古い観測に基づきます。現時点の到達可否は保留です。';action=btn('ボーダーを更新','observe','primary');}else if(c.mins==null){title='自分の速さを、測ろう。';big='10';unit='分から';explain='放置時間を含む記録間隔ではなく、実際に走った時間で計算します。';action=btn('走行を計測する','start','primary');}else if(c.need===0){title='想定ラインに、届いている。';big='0';explain='選んだ想定での追加走行は不要。順位の確約ではありません。';action=btn('ボーダーを確認して記録','observe','primary');}else if(c.avail===0){title='あと何分、確保できる？';big=fmt(Math.ceil(c.mins));explain='必要な走行時間の見積もりです。実際に走れる枠を作戦に置きます。';action=btn('走れる時間を置く','window','primary');}else if(c.spare<0){title='いまの予定では、足りない。';big=fmt(Math.ceil(-c.spare));unit='分不足';explain='時間を増やすか、目標順位を選び直すか。作戦で比較できます。';action=btn('目標を比較する','goPlan','primary');}else{title='予定の時間には、収まる。';big=fmt(Math.ceil(c.mins));explain=`あと${mins(c.mins)}走る試算。予定には${mins(c.spare)}の余白があります。`;action=btn('走行を始める','start','primary');}
return `<div class="grid"><div class="stack"><section class="card hero"><div class="eyebrow">${e.mode==='rank'?e.target+'位を目指す':'ポイント目標'} / NEXT ACTION</div><h2>${title}</h2><div class="big">${big}<span>${unit}</span></div><p>${explain}</p><div class="row">${action}</div></section><section class="card"><div class="sectionhead"><h2>いまの距離</h2>${btn('＋ 数字を記録','observe','link')}</div><div class="cols"><div><small>自分 · ${c.my?tm(c.my.ts):'未記録'}</small><div class="metric">${compact(c.my?.myPoints)}</div><small>${fmt(c.my?.myPoints)} Pt</small></div><div><small>${e.mode==='rank'?e.target+'位 · '+(c.f?tm(c.f.ts):'未記録'):'目標'}</small><div class="metric">${compact(e.mode==='rank'?c.f?.last:e.goal)}</div><small>${fmt(e.mode==='rank'?c.f?.last:e.goal)} Pt</small></div></div>${miniChart(e)}<div class="row"><small>実測の推移 · 自分 ━ / ボーダー ┄</small><small>横軸：時間</small></div></section></div><div class="stack"><section class="card"><div class="sectionhead"><h2>終わりまでの作戦</h2>${btn('調整','goPlan','link')}</div><div class="stat"><small>${e.mode==='rank'?(e.scenario==='high'?'加速を見込む':'直近の伸びが続く')+' · 余裕 '+e.margin+'%込み':'到達目標'}</small><div class="metric">${compact(c.line)} <small>Pt</small></div></div><div class="stat row"><span>あと必要なポイント</span><b>${compact(c.need)}</b></div><div class="stat row"><span>実走ペース</span><b>${c.s.rate==null?'未計測':compact(c.s.rate*60)+'/時'}</b></div><small>${esc(e.phase)} · 直近${c.s.count}走の中央値</small><div class="stat row"><span>これから走れる時間</span><b>${mins(c.avail)}</b></div><p class="caption">${c.stale?'観測が古いため、まず更新してください。':'予測は条件付きの試算です。'} 速度もボーダーも変わったら、必要時間を計算し直します。</p></section><section class="card"><div class="sectionhead"><h2>次の予定</h2>${btn('＋','window','link','aria-label="予定を追加"')}</div>${schedule(e,c.mins,2)}${e.why?'<div class="rule"></div><small>今回の着地点</small><p>'+esc(e.why)+'</p>':''}</section></div></div>`;}
function miniChart(e){const a=(e.records||[]).filter(r=>r.ts<=Date.now()).sort((a,b)=>a.ts-b.ts).slice(-30);if(a.length<2)return '<div class="empty">2回目の記録から、推移が見えます。</div>';const vals=a.flatMap(r=>[r.myPoints,r.borders?.[e.target]]).filter(finite);if(!vals.length)return '';const lo=Math.min(...vals),hi=Math.max(...vals),t0=a[0].ts,t1=a.at(-1).ts;const path=key=>a.filter(r=>finite(key(r))).map(r=>`${18+((r.ts-t0)/(t1-t0||1))*364},${110-((key(r)-lo)/(hi-lo||1))*86}`).join(' ');return `<svg class="plot" viewBox="0 0 400 140" role="img" aria-label="記録した自分と目標順位ボーダーの推移"><line x1="18" y1="110" x2="382" y2="110" stroke="var(--line)"/><polyline points="${path(r=>r.borders?.[e.target])}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><polyline points="${path(r=>r.myPoints)}" fill="none" stroke="currentColor" stroke-width="3"/><text x="18" y="135" fill="var(--muted)" font-size="10">${tm(t0)}</text><text x="355" y="135" fill="var(--muted)" font-size="10">${tm(t1)}</text></svg>`;}
function schedule(e,need,max=99){const a=allocate(e,Date.now(),need);if(!a.length)return '<p class="muted">未設定。仕事や観戦の予定を避けて、走れる時間だけ置きます。</p>';return a.slice(0,max).map(w=>`<div class="timeblock"><div class="row"><div><b>${dt(w.start)}</b><br><small>〜 ${tm(w.end)} · ${mins(w.capacity)}確保</small></div><span class="tag">${w.run==null?'必要量未計算':w.run===0?'予備枠':mins(w.run)+'走る'}</span></div></div>`).join('')+(a.length>max?'<small>ほか '+(a.length-max)+'枠</small>':'');}
function runView(e){const s=speed(e);return `<div class="grid"><div class="stack"><section class="card hero"><div class="eyebrow">PLAY SESSION</div><h2>ゲームへ行って、<br>戻ったら数字をひとつ。</h2><p style="margin-top:18px">${e.mode==='media'?'試合・宝箱で実際に増えたコインを記録。順位報酬は別に受け取ります。':'開始時のポイントを控え、戻ったら終了ポイントを入力。実際の走行時間から自分の速さを測ります。'}</p><div class="row">${btn(state.live?'計測中の走行へ':'走行を始める',state.live?'live':'start','primary')}</div></section><section class="card"><h2>計測を忘れたときも。</h2><p class="caption">走った時間と${e.mode==='media'?'獲得コイン':'獲得ポイント'}がわかれば、後から残せます。</p><div style="margin-top:15px">${btn('実走を手入力','manualRun','secondary wide')}</div></section></div><div class="stack"><section class="card"><small>現在の走り方</small><h2>${esc(e.phase)}</h2><p class="caption">特効・叩き方・ボーナス状態が変わったら、走り方を切り替えます。別条件の速さは混ぜません。</p>${btn('走り方を変更','phase','link')}<div class="rule"></div><div class="metric">${s.rate==null?'未計測':compact(s.rate*60)} <small>${e.mode==='media'?'コイン':'Pt'} / 時</small></div><small>直近${s.count}走の中央値</small></section><section class="card"><h2>最近の走行</h2>${sessionList(e,4)}</section></div></div>`;}
function costPlan(e,c){const s=c.s.samples,all=s.length>0&&s.every(x=>finite(x.cost));const per=all?median(s.map(x=>x.cost/x.minutes)):null;const need=c.mins==null||per==null?null:Math.ceil(c.mins*per);return {per,need,left:finite(e.vamoBudget)&&need!=null?e.vamoBudget-need:null};}
function planView(e){if(e.mode==='media')return mediaPlan(e);const c=assess(e,Date.now());return `<div class="grid"><div class="stack"><section class="card"><div class="sectionhead"><h2>どこで終える？</h2><span class="pill">${e.mode==='rank'?'順位目標':'累計目標'}</span></div>${e.mode==='rank'?`<div class="choices">${e.ranks.map(r=>btn(r+'位','target',r===e.target?'active':'',`data-value="${r}"`)).join('')}</div><table class="compare"><thead><tr><th>目標</th><th>追加走行</th><th>予定の余白</th></tr></thead><tbody>${e.ranks.map(r=>{const a=assess(e,Date.now(),r);return `<tr class="${r===e.target?'selected':''}"><td>${r}位</td><td>${mins(a.mins)}</td><td class="${a.spare<0?'bad':''}">${a.spare==null?'—':(a.spare<0?'不足 ':'+')+mins(Math.abs(a.spare))}</td></tr>`;}).join('')}</tbody></table><p class="caption">${c.stale?'古い観測に基づく参考値です。':'同じ想定・実走条件で比較しています。'} 欲しい報酬に見合う目標か、自分で選びます。</p>`:`<div class="metric">${fmt(e.goal)} Pt</div>`}${btn('目標・想定を編集','strategy','link')}<div class="rule"></div><small>今回の着地点</small><p>${esc(e.why||'欲しい報酬や、守りたい予定をひとこと。')}</p></section><section class="card"><div class="sectionhead"><h2>走れる時間を置く</h2>${btn('＋ 予定','window','link')}</div>${schedule(e,c.mins)}<div class="rule"></div><small>残りの枠を合計 · 重複は除外</small><div class="metric">${mins(c.avail)}</div>${(e.windows||[]).length?`<details><summary>予定を管理</summary>${e.windows.map(w=>`<div class="listline row"><small>${dt(w.start)}〜${tm(w.end)}</small>${btn('削除','deleteWindow','link',`data-value="${esc(w.id)}"`)}</div>`).join('')}</details>`:''}</section></div><div class="stack"><section class="card"><div class="eyebrow">ASSUMPTIONS</div><h2>予測を、ブラックボックスにしない。</h2><div class="stat"><small>直近の伸びが続く想定</small><div class="metric">${compact(c.f?.base)} <small>Pt</small></div></div><div class="stat"><small>加速を見込む想定</small><div class="metric">${compact(c.f?.high)} <small>Pt</small></div></div><p class="caption">直近3区間のボーダー時速の中央値で延長。加速想定は「その${e.accel}倍」と「3区間の最大値」の高い方です。さらに目標へ${e.margin}%の余裕を足します。</p><p class="caption">これは統計的な確率・上限ではありません。観測していない急加速や、他の参加者のチケット放出は予測できません。</p><p class="caption">選んだ走り方を必要時間ぶん続けられる前提です。チケットやBPが尽きたら、通常時の走り方に切り替えて再計算してください。</p><details><summary>以前の手帳から変えたこと</summary><p>開催条件が違う過去のイベントを自動で学習に混ぜません。実走ペースは記録と記録の間隔ではなく、計測した走行だけを使います。経過した予定は自動で除外します。</p></details></section><section class="card"><h2>バモの上限も決める</h2><div class="stat row"><span>これから使える上限</span><b>${finite(e.vamoBudget)?fmt(e.vamoBudget):'未設定'}</b></div><div class="stat row"><span>追加走行の使用見込み</span><b>${fmt(costPlan(e,c).need)}</b></div>${costPlan(e,c).left<0?'<p class="bad">上限を '+fmt(-costPlan(e,c).left)+' バモ超える試算です。</p>':''}<p class="caption">同じ走り方の直近実走に、バモ使用量をすべて入力した場合だけ計算。GP・BP薬の残量差からは推定しません。所持薬が尽きれば条件が変わります。</p>${btn('上限を設定','budget','link')}</section>${btn('最終結果を残す','finishEvent','secondary wide')}</div></div>`;}
function sessionList(e,max=99){return e.sessions.length?[...e.sessions].sort((a,b)=>b.ts-a.ts).slice(0,max).map(s=>`<div class="listline"><div class="row"><b>＋${compact(s.gain)}</b><span>${mins(s.minutes)}</span></div><small>${dt(s.ts)} · ${esc(s.phase)}</small><div class="row"><small>${s.cost!=null?'バモ使用 '+fmt(s.cost):''}</small>${btn('削除','deleteSession','link',`data-value="${esc(s.id)}"`)}</div></div>`).join(''):'<p class="empty">最初の1走が、作戦の基準になります。</p>';}
function historyView(e){return `<div class="card"><div class="sectionhead"><h2>積み重ねた記録</h2>${btn('＋ 記録',e.mode==='media'?'daily':'observe','link')}</div><div class="minitabs">${btn('数字','historyTab',historyTab==='obs'?'active':'', 'data-value="obs"')}${btn('実走','historyTab',historyTab==='runs'?'active':'','data-value="runs"')}</div>${historyTab==='runs'?sessionList(e):e.mode==='media'?dailyHistory(e):[...e.records].sort((a,b)=>b.ts-a.ts).map(r=>`<div class="listline"><div class="row"><b>${fmt(r.myPoints)} <small>Pt</small></b>${btn('編集','editRecord','link',`data-value="${esc(r.id)}"`)}</div><small>${dt(r.ts)}${r.myRank?' · '+r.myRank+'位':''}</small><p class="caption">${Object.entries(r.borders||{}).map(([k,v])=>k+'位 '+compact(v)).join(' / ')}</p>${r.note?'<small>'+esc(r.note)+'</small>':''}</div>`).join('')||'<div class="empty">まだ記録がありません。</div>'}</div>`;}
function mediaView(e){const c=coinState(e),d=mediaDay(e,Date.now()),total=Math.max(1,Math.ceil((e.end-e.start)/86400000)),day=dayPick||Math.min(total,Math.max(1,d.day));const latestDay=e.daily.filter(r=>r.day===day).sort((a,b)=>a.ts-b.ts).at(-1);return `<div class="grid"><div class="stack"><section class="card hero"><div class="eyebrow">COIN GOAL / ${fmt(e.goal)} コイン</div><h2>${e.goal>0?'交換まで、あと。':'交換の目標を決めよう。'}</h2><div class="big">${e.goal>0?compact(c.rest):'—'}<span>コイン</span></div><p>残高 ${fmt(c.balance)}。未受取の報酬は、まだ足しません。</p><div class="row">${btn('入出金を記録','coin','primary')}${btn('報酬の見込みを確認','goPlan','primary')}</div></section><section class="card"><div class="sectionhead"><h2>今日の3枠</h2>${btn('記録する','daily','link',`data-value="${day}"`)}</div><div class="daygrid">${Array.from({length:Math.min(total,14)},(_,i)=>btn('Day '+(i+1),'day',day===i+1?'active':'',`data-value="${i+1}"`)).join('')}</div><p class="caption">${Date.now()>=e.end?'イベント終了':d.collect?'13:30〜14:00 集計中':`Day ${d.day} · ${dt(Math.min(d.close,e.end))} 締切`}（日本時間）</p>${latestDay?latestDay.slots.map(s=>`<div class="listline"><div class="row"><h3>${esc(s.name)}</h3><span class="tag">${esc(s.mode||'方式未設定')}</span></div><small>${esc(s.sub||'種目未記録')}</small><div class="row" style="margin-top:9px"><span class="metric">${s.rank?fmt(s.rank)+'位':'—'}</span><span>${s.target?'目標 '+s.target+'位':''}</span></div><small>スコア ${fmt(s.score)}${s.mode==='1MATCH'?' · 最高記録を競う枠':''}</small></div>`).join(''):'<div class="empty">この日の枠は未記録です。</div>'}<p class="caption">アプリ内の記録はゲームの登録操作と連動しません。ゲーム内で枠を上書きすると、そのランキングのスコアを失う場合があります。</p></section></div><div class="stack"><section class="card"><h2>時間だけでは、埋まらない。</h2><div class="stat row"><span>現在の不足</span><b>${fmt(c.rest)}</b></div><div class="stat row"><span>未受取の報酬見込み</span><b>${fmt(c.pending)}</b></div><div class="stat"><small>見込みをすべて受け取れた場合の不足</small><div class="metric">${fmt(c.conditional)}</div></div><div class="stat"><small>その不足を試合で稼ぐ時間の試算</small><div class="metric">${mins(c.mins)}</div></div><p class="caption">順位報酬は、時間に比例させません。試合・宝箱で実際に得たコインだけを実走ペースに使います。1MATCHの順位やスコアも、時間では延長しません。</p>${btn('試合の稼ぎを測る','start','secondary wide')}</section><section class="card"><h2>最近の入出金</h2>${ledgerList(e,4)}</section></div></div>`;}
function ledgerList(e,max=99){return [...e.ledger].reverse().slice(0,max).map(t=>`<div class="listline"><div class="row"><span>${esc(t.label)}</span><b>${t.amount>=0?'+':''}${fmt(t.amount)}</b></div><small>${dt(t.ts)}</small></div>`).join('')||'<p class="empty">まだ入出金はありません。</p>';}
function mediaPlan(e){const c=coinState(e);return `<div class="grid"><div class="stack"><section class="card"><div class="sectionhead"><h2>欲しいものから、逆算。</h2>${btn('編集','strategy','link')}</div><p>${esc(e.why||'今回の交換目標を決めます。')}</p><div class="stat"><small>必要な残高</small><div class="metric">${fmt(e.goal)} コイン</div></div><p class="caption">開催ごとの交換所を見て入力してください。過去の報酬額は自動設定しません。</p></section><section class="card"><div class="sectionhead"><h2>まだ受け取っていない報酬</h2>${btn('＋ 見込み','bonus','link')}</div>${e.bonuses.map(b=>`<div class="listline"><h3>${esc(b.label)}</h3><div class="row"><span>${fmt(b.amount)} コイン</span>${b.received?'<span class="tag">受取済み</span>':btn('受け取った','receive','secondary',`data-value="${esc(b.id)}"`)}</div>${!b.received?btn('削除','deleteBonus','link',`data-value="${esc(b.id)}"`):''}</div>`).join('')||'<p class="empty">順位×難易度で変わるため、見込み額を自分で置きます。</p>'}<p class="caption">「受け取った」で残高に1回だけ加算します。すでに入金した報酬を重複して受け取らないでください。</p></section></div><div class="stack"><section class="card"><div class="sectionhead"><h2>走れる時間</h2>${btn('＋ 予定','window','link')}</div>${schedule(e,c.mins)}<p class="caption">順位報酬の見込みが実現することを前提に、残りを試合で埋める作戦です。</p>${e.windows.length?`<details><summary>予定を管理</summary>${e.windows.map(w=>`<div class="listline row"><small>${dt(w.start)}〜${tm(w.end)}</small>${btn('削除','deleteWindow','link',`data-value="${esc(w.id)}"`)}</div>`).join('')}</details>`:''}</section><section class="card"><div class="sectionhead"><h2>コイン帳</h2>${btn('入出金','coin','link')}</div>${ledgerList(e)}<div class="rule"></div><small>開始残高 ${fmt(e.coinStart)}</small><div class="metric">現在 ${fmt(c.balance)}</div></section>${btn('イベントを終了する','finishEvent','secondary wide')}</div></div>`;}
function dailyHistory(e){return [...e.daily].sort((a,b)=>b.day-a.day||b.ts-a.ts).map(r=>`<div class="listline"><div class="row"><b>Day ${r.day}</b><small>${dt(r.ts)}</small></div>${r.slots.map(s=>`<p>${esc(s.name)} · ${fmt(s.rank)}位 <small>${esc(s.sub||'')}</small></p>`).join('')}${btn('編集','editDaily','link',`data-value="${esc(r.id)}"`)}</div>`).join('')||'<p class="empty">まだ記録がありません。</p>';}
function review(e){const total=e.sessions.reduce((s,x)=>s+x.minutes,0),cost=e.sessions.filter(x=>finite(x.cost)).reduce((s,x)=>s+x.cost,0);return `<section class="card hero"><div class="eyebrow">FINISHED / おつかれさまでした</div><h2>${e.mode==='media'?'コイン残高 '+fmt(coinState(e).balance):e.finalRank?'最終 '+fmt(e.finalRank)+'位':'最終結果は未記録'}</h2><div class="big">${fmt(total)}<span>分走った</span></div><p>手動で入力したバモ使用量：${fmt(cost)}。入力していない消費は含みません。</p></section><div class="card" style="margin-top:20px"><h2>今回の着地点</h2><p>${esc(e.why||'メモなし')}</p><p class="caption">${esc(e.review||'振り返りはまだありません。')}</p>${btn('結果を編集','finishEvent','link')}${btn('開催中へ戻す','reopen','link')}<div class="rule"></div>${sessionList(e,5)}</div>`;}
function eventForm(e){const n=Date.now();modal(e?'イベントの設定':'新しい作戦を作る',`${field('イベント名','ename',e?.name||'', 'text','required maxlength="90"')}<label>イベント<select id="etype">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${e?.type===k?'selected':''}>${v}</option>`).join('')}</select></label><label>今回の目的<select id="emode"><option value="rank" ${e?.mode==='rank'?'selected':''}>順位を目指す</option><option value="goal" ${e?.mode==='goal'?'selected':''}>累計ポイントまで走る</option><option value="media" ${e?.mode==='media'?'selected':''}>マスメディア（3枠＋コイン）</option></select></label>${field('開始日時（日本時間）','estart',inpDate(e?.start||n),'datetime-local','required')}${field('終了日時（日本時間）','eend',inpDate(e?.end||n+7*24*H),'datetime-local','required')}<p class="caption">日程・報酬は開催中のゲーム内表示に合わせてください。</p>`,()=>{const start=readDate(val('estart')),end=readDate(val('eend')),mode=val('etype')==='media'?'media':val('emode');if(!finite(start)||!finite(end)||end<=start)throw Error('終了は開始より後にしてください');if(val('etype')!=='media'&&mode==='media')throw Error('マスメディアを選ぶ場合はイベント種別も変更してください');if(e&&e.mode!==mode&&(e.records.length||e.sessions.length||e.daily.length||e.ledger.length))throw Error('記録のあるイベントの目的は変更できません。別イベントを作ってください。');submit(()=>{if(e){Object.assign(e,{name:val('ename'),type:val('etype'),mode,start,end});}else{const item=freshEvent(val('ename'),val('etype'),start,end,mode);state.events.push(item);state.selected=item.id;view='plan';}});});}
function strategy(e){modal('目標と想定',`${e.mode==='rank'?`${field('比較する順位（カンマ区切り）','ranks',e.ranks.join(','))}${numeric('狙う順位','target',e.target,true)}<label>採用する想定<select id="scenario"><option value="high" ${e.scenario==='high'?'selected':''}>加速を見込む</option><option value="base" ${e.scenario==='base'?'selected':''}>直近の伸びが続く</option></select></label>${numeric('加速倍率（1〜5、自分で置く仮定）','accel',e.accel,true)}${numeric('目標ラインに足す余裕（0〜50%）','margin',e.margin,true)}`:numeric(e.mode==='media'?'交換に必要なコイン残高':'目標ポイント','goal',e.goal,true)}${field('今回の着地点・欲しい報酬','why',e.why||'','text','maxlength="200"')}`,()=>{let data={why:val('why')};if(e.mode==='rank'){const target=positive('target'),ranks=val('ranks').split(/[,、，\s]+/).filter(Boolean).map(Number),margin=num('margin',true),accel=num('accel',true);if(!Number.isInteger(target)||ranks.length>8||ranks.some(x=>!Number.isInteger(x)||x<=0))throw Error('順位は正の整数で、8個までにしてください');if(margin>50||accel<1||accel>5)throw Error('余裕は0〜50、加速倍率は1〜5にしてください');data={...data,target,ranks:[...new Set([...ranks,target])].sort((a,b)=>a-b),margin,accel,scenario:val('scenario')};}else data.goal=positive('goal');submit(()=>Object.assign(e,data));});}
function observe(e,record){const c=latest(e,null,Date.now()).at(-1),r=record;modal(r?'記録を編集':'いまの数字だけ記録',`${numeric('自分のポイント（空欄ならボーダーのみ）','myp',r?.myPoints??'')}<p class="fieldhelp">前回 ${fmt(c?.myPoints)} Pt · 1.2億、850万の入力にも対応</p>${e.mode==='rank'?`${numeric('自分の順位（任意）','myrank',r?.myRank??'')}${numeric(e.target+'位のボーダー','bd'+e.target,r?.borders?.[e.target]??'')}<details><summary>ほかの順位も記録</summary><div class="formgrid">${e.ranks.filter(x=>x!==e.target).map(rank=>numeric(rank+'位のボーダー','bd'+rank,r?.borders?.[rank]??'')).join('')}</div></details>`:''}${field('観測した日時（日本時間）','obsdate',inpDate(r?.ts||Date.now()),'datetime-local','required')}${field('メモ（任意）','obsnote',r?.note||'')}${r?btn('この記録を削除','deleteRecord','danger',`type="button" data-value="${esc(r.id)}"`):''}`,()=>{const myPoints=num('myp'),myRank=e.mode==='rank'?num('myrank'):null,borders={},ts=readDate(val('obsdate'));if(!finite(ts)||ts> Date.now()+M||ts<e.start||ts>e.end)throw Error('観測日時はイベント期間内の過去〜現在にしてください');if(myRank!=null&&(!Number.isInteger(myRank)||myRank<1))throw Error('順位は1以上の整数です');if(e.mode==='rank')for(const rank of e.ranks){const v=num('bd'+rank);if(v!=null)borders[rank]=v;}if(myPoints==null&&!Object.keys(borders).length)throw Error('ポイントかボーダーを1つ入力してください');const keys=Object.keys(borders).map(Number).sort((a,b)=>a-b);for(let i=1;i<keys.length;i++)if(borders[keys[i]]>borders[keys[i-1]])throw Error('下の順位のボーダーが上の順位を超えています');submit(()=>{const next={...r,id:r?.id||uid(),ts,myPoints,myRank,borders,note:val('obsnote')};if(r)e.records[e.records.findIndex(x=>x.id===r.id)]=next;else e.records.push(next);});});}
function addWindow(e){let start=Math.max(Date.now(),e.start);modal('走れる時間を置く',`${field('開始（日本時間）','wstart',inpDate(start),'datetime-local','required')}${field('終了（日本時間）','wend',inpDate(Math.min(start+H,e.end)),'datetime-local','required')}<p class="caption">この時間を全部走る必要はありません。必要な分を早い枠から割り当て、余った枠は予備にします。</p>`,()=>{const start=readDate(val('wstart')),end=readDate(val('wend'));if(!finite(start)||!finite(end)||end<=start||end>e.end||start<e.start||end<=Date.now())throw Error('開催期間内で、これから走れる時間を指定してください');submit(()=>e.windows.push({id:uid(),start,end}));});}
function choosePhase(e){const phases=[...new Set(e.sessions.map(s=>s.phase))];modal('走り方を切り替える',`${field('走り方の名前','phase',e.phase,'text','required maxlength="80"')}<p class="caption">例：銀トロ・5叩き／通常試合／チケット放出／特効変更後。過去と同じ名前にすると、その条件の実走を再利用します。</p>${phases.length?'<small>記録済み：'+phases.map(esc).join(' / ')+'</small>':''}`,()=>submit(()=>{e.phase=val('phase');}));}
function elapsed(l,n=Date.now()){return l.ms+(l.paused?0:Math.max(0,n-l.resumed));}
function startRun(e){if(state.live){showLive();return;}if(Date.now()<e.start||Date.now()>=e.end){notify('イベント期間外です');return;}const my=latest(e,null,Date.now()).at(-1);modal('走行を始める',`${e.mode==='media'?'<p>試合・宝箱だけの獲得コインを、終了時に入力します。</p>':numeric('ゲーム内の現在ポイント','startPt',my?.myPoints??'',true)}${field('今回の走り方','runPhase',e.phase,'text','required maxlength="80"')}<p class="caption">終了時に実際に走った分数を確認します。中断中は一時停止できます。</p>`,()=>{const startPt=e.mode==='media'?null:num('startPt',true),phase=val('runPhase');if(change(()=>{e.phase=phase;state.live={eventId:e.id,started:Date.now(),resumed:Date.now(),ms:0,paused:false,startPt,phase};})){close();render();showLive();}},'計測を始めてゲームへ');}
function tick(){if(state.live){const ms=elapsed(state.live),text=Math.floor(ms/M)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');if($('clock'))$('clock').textContent=text;if($('liveClock'))$('liveClock').textContent=text;}}
function showLive(){const l=state.live;if(!l)return;const e=state.events.find(x=>x.id===l.eventId);if(!e)return;modal('走行を計測中',`<div class="eyebrow">${esc(e.name)}</div><div class="metric" id="liveClock">—</div><p>${esc(l.phase)} · ${l.paused?'一時停止中':'計測中'}</p>${btn(l.paused?'計測を再開':'一時停止',l.paused?'resume':'pause','secondary','type="button"')}${btn('走行を終えて入力','endRun','primary','type="button"')}${btn('計測を破棄','cancelRun','link','type="button"')}<p class="caption">ゲームとの往復・画面を閉じる間も保持します。食事や中断を含めた場合は、終了時に実走時間を直してください。</p>`,null);tick();}
function finishRun(e,live=false){const l=live?state.live:null;if(l&&!l.paused){if(!change(()=>{state.live.ms=elapsed(state.live);state.live.paused=true;}))return;}const minutes=l?Math.max(1,Math.round(elapsed(l)/M)):'';modal(l?'走行を保存':'実走を手入力',`${numeric('実際に走った時間（分）','runMin',minutes,true)}${numeric(l&&e.mode!=='media'?'終了時の自分のポイント':e.mode==='media'?'試合・宝箱で獲得したコイン':'この走行で獲得したポイント','runGain','',true)}${l&&e.mode!=='media'?'<small>開始 '+fmt(l.startPt)+' Pt</small>':''}${field('走り方','finishPhase',l?.phase||e.phase,'text','required maxlength="80"')}<details><summary>使ったバモを残す（任意）</summary>${numeric('この走行で実際に使用したバモ','cost','')}<p class="caption">残量の差ではなく、使った分だけ。報酬での補充は含めません。</p></details><p class="caption">${e.mode==='media'?'獲得コインは残高にも加算します。すでに入金した分は重複して記録しないでください。':'途中で別の走り方をした場合は、分けて手入力すると正確です。'}</p>`,()=>{const minutes=positive('runMin'),value=num('runGain',true),gain=l&&e.mode!=='media'?value-l.startPt:value,cost=num('cost');if(gain<0)throw Error('終了ポイントが開始ポイントを下回っています');if(minutes>1440*7)throw Error('走行時間を確認してください');const phase=val('finishPhase'),ts=Date.now(),id=uid();submit(()=>{e.sessions.push({id,ts,minutes,gain,phase,cost});e.phase=phase;if(e.mode==='media')e.ledger.push({id:uid(),ts,amount:gain,label:'実走で獲得',sessionId:id});else if(l)e.records.push({id:uid(),ts:Math.min(ts,e.end),myPoints:value,myRank:null,borders:{}});if(l)state.live=null;},'走行を保存し、作戦を更新しました');});}
function coinForm(e){modal('コインの入出金',`<label>種別<select id="coinKind"><option value="income">入金（試合・宝箱・報酬）</option><option value="spend">交換・支出</option><option value="balance">ゲームの残高に合わせて補正</option></select></label>${numeric('コイン枚数','coinAmount','',true)}${field('内容','coinLabel','','text','required maxlength="100"')}<p class="caption">開始残高も「残高に合わせて補正」で入力できます。未受取報酬から受け取った分は、ここで再度入金しないでください。</p>`,()=>{const v=num('coinAmount',true),kind=val('coinKind'),c=coinState(e),amount=kind==='balance'?v-c.balance:kind==='spend'?-v:v;if(c.balance+amount<0)throw Error('残高を超える支出です');submit(()=>e.ledger.push({id:uid(),ts:Date.now(),amount,label:val('coinLabel')}));});}
function bonusForm(e){modal('報酬の見込みを置く',`${field('いつ・何の報酬か','bonusLabel','','text','required maxlength="100"')}${numeric('見込みコイン（残高にはまだ加算しない）','bonusAmount','',true)}<p class="caption">順位・難易度に応じた額をゲーム内で確認してください。日数やプレイ時間で自動的に増やしません。</p>`,()=>{const amount=positive('bonusAmount');submit(()=>e.bonuses.push({id:uid(),label:val('bonusLabel'),amount,received:false}));});}
function dailyForm(e,day,rec){const count=Math.max(1,Math.min(14,Math.ceil((e.end-e.start)/86400000))),d=day||Math.max(1,Math.min(count,mediaDay(e,Date.now()).day));const prev=rec||e.daily.filter(r=>r.day===d).sort((a,b)=>a.ts-b.ts).at(-1),slots=prev?.slots||[];const media=['メインホール','ニュービーFOOTBALL','SOCCER ZONE','Football General','JクラSPORTS','SOCCER WISDOM','月刊Jクラクラシック'];modal('3枠を記録',`<label>記録するDay<select id="dailyDay">${Array.from({length:count},(_,i)=>`<option value="${i+1}" ${i+1===d?'selected':''}>Day ${i+1}</option>`).join('')}</select></label>${[0,1,2].map(i=>{const s=slots[i]||{};return `<div class="card formgrid"><h3>枠 ${i+1}</h3><label>メディア<select id="slotName${i}"><option value="">未登録</option>${[...new Set([...media,...(s.name?[s.name]:[])])].map(x=>`<option ${s.name===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>${field('種目','slotSub'+i,s.sub||'')}<label>集計方式<select id="slotMode${i}"><option value="TOTAL" ${s.mode==='TOTAL'?'selected':''}>TOTAL（その日の累計）</option><option value="1MATCH" ${s.mode==='1MATCH'?'selected':''}>1MATCH（1試合の最高）</option><option value="unknown" ${!s.mode||s.mode==='unknown'?'selected':''}>未確認</option></select></label><div class="cols">${numeric('現在順位','slotRank'+i,s.rank??'')}${numeric('目標順位（任意）','slotTarget'+i,s.target??'')}</div>${numeric('スコア（任意）','slotScore'+i,s.score??'')}</div>`;}).join('')}<p class="caption">Dayを選んで保存します。編集によって他の日の記録やゲーム側の枠は変わりません。</p>`,()=>{const rows=[];for(let i=0;i<3;i++){const name=val('slotName'+i);if(!name)continue;const rank=num('slotRank'+i),target=num('slotTarget'+i),score=num('slotScore'+i);if([rank,target].some(x=>x!=null&&(!Number.isInteger(x)||x<1)))throw Error('順位は1以上の整数で入力してください');rows.push({name,sub:val('slotSub'+i),mode:val('slotMode'+i),rank,target,score});}if(!rows.length)throw Error('1つ以上のメディアを選んでください');const day=Number(val('dailyDay'));submit(()=>{if(rec){const idx=e.daily.findIndex(x=>x.id===rec.id);e.daily[idx]={...rec,day,slots:rows};}else e.daily.push({id:uid(),day,ts:Date.now(),slots:rows});dayPick=day;});});}
function finalForm(e){modal('最終結果を残す',`${e.mode==='rank'?numeric('ゲーム内の最終順位（未確認なら空欄）','finalRank',e.finalRank??''):''}<label>振り返り<textarea id="review">${esc(e.review||'')}</textarea></label><p class="caption">途中の最高順位で代用しません。終了を記録すると、作戦画面が振り返りに変わります。</p>`,()=>{const rank=e.mode==='rank'?num('finalRank'):null;if(rank!=null&&(!Number.isInteger(rank)||rank<1))throw Error('順位を確認してください');submit(()=>{e.finalRank=rank;e.review=val('review');e.status='done';});});}
function download(name,text,mime='application/json'){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function dataPanel(){modal('データと使い方',`<div class="info">${DEMO?'サンプル専用の保存領域です。架空データを自由に試せます。':'NEXT専用に保存しています。旧手帳の保存領域は変更しません。'}</div>${btn('JSONバックアップを保存','export','primary wide','type="button"')}<label>旧手帳 / NEXT のJSONを取り込む<input type="file" id="importFile" accept=".json,application/json"></label><p class="caption">既存イベントへ追加します。旧データの原文もバックアップに保持します。旧版の複数ボードは別イベントとして取り込みます。</p><details><summary>JSONを貼り付けて取り込む</summary><textarea id="importText" aria-label="取り込むJSON"></textarea>${btn('内容を確認','importText','secondary','type="button"')}</details>${!DEMO?btn('同じURLの旧手帳データを探す','localImport','secondary','type="button"'):''}<label>テーマ<select id="theme"><option value="auto" ${state.theme==='auto'?'selected':''}>端末に合わせる</option><option value="light" ${state.theme==='light'?'selected':''}>ライト</option><option value="dark" ${state.theme==='dark'?'selected':''}>ダーク</option></select></label><details><summary>開き方・保存について</summary><p>HTMLの添付プレビューでは操作できないことがあります。GitHub PagesへHTMLを置き、SafariでそのURLを開いてください。画面の文字をコピーしてもHTMLコードにはなりません。配布するsource.txtがコード全文です。</p><p>本アプリは通信せず動作します。ただし単一HTMLだけでは、iPhoneでのオフライン再起動を保証できません。Safariがページを保持している間は通信不要です。ホーム画面追加だけで永続キャッシュされるとは限りません。</p><p>保存は端末・ブラウザ・URLのオリジンごとです。ブラウザのデータ削除に備えてJSONを保存してください。</p></details><details><summary>設計の根拠</summary><p>トロラン実走記（くにゅ氏、2026/2/18）での終盤加速・目標変更、マスメディア実走記（U-4氏、2025/11/20）での実走時給・段階制報酬を参考に設計。攻略数値は開催ごとに変わるため固定していません。</p><p>ランイベ手帳 NEXT · ${BUILD}<br>非公式・個人用。依存ライブラリなし。</p></details>${storageBlocked?'<p class="bad">保存領域の読み込みに失敗しました。元のデータは上書きしていません。バックアップしてからブラウザの保存設定を確認してください。</p>':''}`,null);$('theme').onchange=()=>{change(()=>state.theme=val('theme'));theme();};$('importFile').onchange=async()=>{try{const f=$('importFile').files[0];if(!f)return;if(f.size>10e6)throw Error('10MB以下のJSONを選んでください');previewImport(await f.text());}catch(err){notify(err.message);}};}
function previewImport(text){const raw=JSON.parse(text),res=importData(raw);modal('取り込み内容の確認',`<p>${res.events.length}件のイベントを追加します。</p><div>${res.events.map(e=>'<div class="listline">'+esc(e.name)+'<br><small>'+e.records.length+'記録 / '+e.sessions.length+'走行</small></div>').join('')}</div><p class="caption">すでに取り込んだデータも再度追加されます。現在のイベントは削除しません。</p>`,()=>{submit(()=>{const imported=res.events.map(e=>({...e,id:uid()}));state.events.push(...imported);if(imported.length)state.selected=imported[0].id;if(res.legacy)state.legacy=[...(Array.isArray(state.legacy)?state.legacy:state.legacy?[state.legacy]:[]),res.legacy];view='now';},'取り込みました');},'追加して取り込む');}
function removeItem(e,key,id){if(!confirm('この記録を削除しますか？'))return;const old=JSON.parse(JSON.stringify(e));if(change(()=>{e[key]=e[key].filter(x=>x.id!==id);if(key==='sessions')e.ledger=e.ledger.filter(x=>x.sessionId!==id);})){undo={eventId:e.id,data:old};close();render();notify('削除しました。データ画面横の「戻す」で復元できます。');$('undo').hidden=false;}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value,e=current();try{if(a==='close')close();else if(a==='nav'){view=v;render();window.scrollTo(0,0);}else if(a==='select'){change(()=>state.selected=v);view='now';dayPick=null;render();}else if(a==='new')eventForm();else if(a==='editEvent')eventForm(e);else if(a==='strategy')strategy(e);else if(a==='observe')observe(e);else if(a==='editRecord')observe(e,e.records.find(x=>x.id===v));else if(a==='goPlan'){view='plan';render();window.scrollTo(0,0);}else if(a==='window')addWindow(e);else if(a==='target'){change(()=>e.target=Number(v));render();}else if(a==='budget')modal('これから使えるバモ',numeric('今後の使用上限（空欄で解除）','vamoBudget',e.vamoBudget??''),()=>{const amount=num('vamoBudget');submit(()=>e.vamoBudget=amount);});else if(a==='phase')choosePhase(e);else if(a==='start')startRun(e);else if(a==='live')showLive();else if(a==='pause'||a==='resume'){if(change(()=>{const l=state.live;l.ms=elapsed(l);l.resumed=Date.now();l.paused=a==='pause';})){render();showLive();}}else if(a==='endRun'){const item=state.events.find(x=>x.id===state.live.eventId);finishRun(item,true);}else if(a==='cancelRun'){if(confirm('計測を破棄しますか？'))submit(()=>state.live=null,'計測を破棄しました');}else if(a==='manualRun')finishRun(e);else if(a==='historyTab'){historyTab=v;render();}else if(a==='coin')coinForm(e);else if(a==='bonus')bonusForm(e);else if(a==='receive'){const b=e.bonuses.find(x=>x.id===v);if(b&&!b.received&&confirm(fmt(b.amount)+'コインを実際に受け取りましたか？残高に加算します。')){change(()=>{b.received=true;e.ledger.push({id:uid(),ts:Date.now(),amount:b.amount,label:b.label,bonusId:b.id});});render();}}else if(a==='daily')dailyForm(e,Number(v)||dayPick);else if(a==='editDaily'){const r=e.daily.find(x=>x.id===v);dailyForm(e,r.day,r);}else if(a==='day'){dayPick=Number(v);render();}else if(a==='finishEvent')finalForm(e);else if(a==='reopen'){change(()=>e.status='active');render();}else if(a==='deleteRecord')removeItem(e,'records',v);else if(a==='deleteSession')removeItem(e,'sessions',v);else if(a==='deleteWindow')removeItem(e,'windows',v);else if(a==='deleteBonus')removeItem(e,'bonuses',v);else if(a==='data')dataPanel();else if(a==='export'){if(storageBlocked&&recoveryRaw==null)notify('保存領域を読み出せずバックアップできませんでした。');else download('ranibe-next-backup-'+new Date().toISOString().slice(0,10)+'.json',storageBlocked?recoveryRaw:JSON.stringify(state,null,2));}else if(a==='importText')previewImport(val('importText'));else if(a==='localImport'){const old=localStorage.getItem('jclub_ranibe_v1');if(!old)notify('このブラウザ・オリジンに旧手帳データがありません。JSONを取り込んでください。');else previewImport(old);}else if(a==='resetDemo'&&DEMO){if(confirm('架空データを今の時刻に合わせて作り直しますか？サンプルでの編集は消えます。')){change(()=>state=demoData());render();}}else if(a==='undo'&&undo){change(()=>state.events[state.events.findIndex(x=>x.id===undo.eventId)]=undo.data);undo=null;$('undo').hidden=true;render();}}catch(err){notify(err.message);}});
$('selector').onchange=()=>{change(()=>state.selected=$('selector').value||null);view='now';dayPick=null;render();};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if(ev.key==='Tab'&&$('modal').firstElementChild){const a=[...$('modal').querySelectorAll('button,input,select,textarea,summary')].filter(x=>!x.disabled&&x.getClientRects().length);if(a.length&&ev.shiftKey&&document.activeElement===a[0]){ev.preventDefault();a.at(-1).focus();}else if(a.length&&!ev.shiftKey&&document.activeElement===a.at(-1)){ev.preventDefault();a[0].focus();}}});
try{const raw=localStorage.getItem(LS_KEY);recoveryRaw=raw;if(raw){const parsed=JSON.parse(raw);if(parsed.schema!==4)throw Error('保存形式が不明です');parsed.events.forEach(validateEvent);if(parsed.live&&(!parsed.events.some(e=>e.id===parsed.live.eventId)||!finite(parsed.live.ms)||!finite(parsed.live.resumed)||parsed.live.ms<0))throw Error('計測データの形式が不明です');state=parsed;}else if(DEMO){state=demoData();persist();}}catch(err){storageBlocked=true;$('storageError').hidden=false;$('storageError').textContent='保存データを読み込めませんでした。元データは上書きしません。データ画面をご確認ください。';}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
setInterval(tick,1000);
window.addEventListener('pageshow',()=>{if(!$('modal').firstElementChild)render();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('modal').firstElementChild)render();});
window.addEventListener('storage',ev=>{if(ev.key!==LS_KEY||!ev.newValue)return;try{const updated=JSON.parse(ev.newValue);if(updated.schema!==4)throw Error('形式');updated.events.forEach(validateEvent);state=updated;close();render();notify('別のタブで保存された内容を反映しました');}catch(err){notify('別タブのデータを読み込めませんでした');}});
window.addEventListener('error',()=>{$('storageError').hidden=false;$('storageError').textContent='画面の処理に失敗しました。再読み込み後も続く場合は、HTMLコード全文が入っているか確認してください。';});
render();
</script></body></html>
